# Verifies the Android module actually builds (debug variant, no signing needed).
# Separate from buildAndTest.yml (which only compiles+checks) and buildAndDeploy.yml
# (which does the full signed release build, only on tag push).

name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'stage-2/non-aggression-pact'
      - 'stage-3/merge-validation-20261016'
      - 'stage-4/advanced-peace-reparations'
      - 'master'
    paths:
      - 'core/**'
      - 'tests/**'
      - 'android/**'
      - 'build.gradle.kts'
      - 'gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'android/build.gradle.kts'
      - '.github/workflows/androidBuild.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tests/**'
      - 'android/**'
      - 'build.gradle.kts'
      - 'gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/androidBuild.yml'
      - 'android/build.gradle.kts'

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' package was pulled from Google's SDK repository; only platform-tools is needed here
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug

      - name: Verify AndroidLauncher class is present in APK
        # Catches regressions where the :android module's Kotlin sources silently
        # stop being compiled (e.g. kotlin-android plugin missing), which produces
        # a working build but a ClassNotFoundException for AndroidLauncher at runtime.
        run: |
          APK=$(find android/build/outputs/apk/debug -name "*.apk" | head -1)
          mkdir -p /tmp/apk-check
          unzip -o "$APK" 'classes*.dex' -d /tmp/apk-check
          if ! grep -al "AndroidLauncher" /tmp/apk-check/classes*.dex > /dev/null; then
            echo "::error::AndroidLauncher class missing from APK dex - Kotlin sources in :android module were not compiled!"
            exit 1
          fi         
      - name: Upload debug APK
        id: apk_upload
        uses: actions/upload-artifact@v4
        with:
          name: living-empires-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 

      - name: Publish APK download and build details
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
          UPLOAD_OUTCOME: ${{ steps.apk_upload.outcome }}
        run: |
          {
            echo '## Living Empires Android debug build'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Upload result: $UPLOAD_OUTCOME"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- [Download debug APK artifact]($ARTIFACT_URL)"
              echo "- Artifact ID: $ARTIFACT_ID"
            else
              echo '- APK artifact unavailable: check the upload step logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
