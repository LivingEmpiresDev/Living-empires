name: Living Empires - Permanent Regression
on:
  workflow_dispatch:
  pull_request:
    branches: [master, stage-5-advanced-diplomacy]
  push:
    branches: [master, testing/permanent-full-game-simulation]
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Run existing game regression tests
        run: ./gradlew :tests:test --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Preserve test and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-empires-regression-evidence
          if-no-files-found: warn
          path: |
            tests/build/test-results/
            tests/build/reports/tests/
            android/build/outputs/apk/debug/
