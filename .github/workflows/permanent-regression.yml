name: Living Empires - Permanent Regression
on:
  workflow_dispatch:
  pull_request:
    
  push:
    
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Run existing game regression tests
        run: ./gradlew :tests:test --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Preserve test and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-empires-regression-evidence
          if-no-files-found: warn
          path: |
            tests/build/test-results/
            tests/build/reports/tests/
            android/build/outputs/apk/debug/

  ai-game-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Simulate 100 AI turns using existing headless engine
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :tests:ojh -Pojh.args="turns --turns 100 --players 8 --size small --seed ${{ matrix.seed }}" | tee ai-turns.log
          test "$(grep -c '^OJH turn ' ai-turns.log)" -eq 100
          grep -q '^OJH ready$' ai-turns.log
      - name: Upload AI turn trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-turns-seed-${{ matrix.seed }}
          path: ai-turns.log
          if-no-files-found: warn
