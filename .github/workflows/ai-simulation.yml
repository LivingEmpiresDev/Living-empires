name: AI Simulation Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/src/com/unciv/logic/GameSimulationRunner.kt'
      - 'tests/src/com/unciv/dev/OjhBenchmark.kt'
      - '.github/workflows/ai-simulation.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Simulate ten 250-turn games with four AI civilizations
        run: |
          set -o pipefail
          ./gradlew :tests:ojh -Pojh.args="simulate --games 10 --turns 250 --players 4 --size small --seed 20261015" --console=plain | tee simulation.log
      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-log
          path: simulation.log
